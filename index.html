<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <title>laboration2</title>
</head>

<body>
  <main class="background">
    <header>
      <h1>Laboration 2</h1>
      <p>Programmering i TypeScript</p>
    </header>
    <div id="dashboard">
      <section id="add-task">
        <h2>Add tasks</h2>
        <p>Fill out the form to add your next task.</p>
        <div class="error"></div>
        <form id="form">
          <div class="inputs">
            <label for="task">Your next task:</label>
            <input type="text" id="task" name="task">
          </div>
          <div class="radio-container">
            <p>Level of priority:</p>
            <div class="radio">
              <label for="priority-1">
                <input type="radio" value="1" name="priority" id="priority-1">
                High
              </label>
              <label for="priority-2">
                <input type="radio" value="2" name="priority" id="priority-2">
                Medium
              </label>
              <label for="priority-3">
                <input type="radio" value="3" name="priority" id="priority-3">
                Low
              </label>
            </div>
          </div>
          <div class="inputs">
            <label for="duedate">Deadline:</label>
            <input type="date" id="duedate" name="duedate">
          </div>
          <button class="buttonstyle" type="submit">Add task</button>
        </form>
      </section>
      <section id="task-list"></section>
    </div>
    <footer>
      <h3>Laboration 2</h3>
      <p>Riina Aaltonen</p>
    </footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
